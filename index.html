
<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бүртгэлийн форм</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <span class="badge">LAB 3</span>

        <h1 class="form-title">Бүртгэлийн форм</h1>
        <p class="form-description">
            Өөрийн мэдээллээ оруулж бүртгүүлнэ үү.
        </p>

        <form>
            <div class="form-group">
                <label for="fullname">Овог, нэр</label>
                <input type="text" id="fullname"
                       class="form-input"
                       placeholder="Нэрээ оруулна уу" required>
            </div>

            <div class="form-group">
                <label for="email">И-мэйл хаяг</label>
                <input type="email" id="email"
                       class="form-input"
                       placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Нууц үг</label>
                <input type="password" id="password"
                       class="form-input"
                       placeholder="Нууц үгээ оруулна уу" required>
            </div>

            <div class="form-group">
                <label for="course">Сонгох хичээл</label>
                <select id="course" class="form-input" required>
                    <option value="">Хичээлээ сонгоно уу</option>
                    <option>Веб хөгжүүлэлт</option>
                    <option>Программчлал</option>
                    <option>Өгөгдлийн сан</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">
                Бүртгүүлэх
            </button>
        </form>

        <p class="form-footer">Мэдээллээ зөв оруулна уу.</p>
    </div>

</body>
</html>
